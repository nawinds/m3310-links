name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
    # Review gh actions docs if you want to further define triggers, paths, etc
    # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#on

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    env:
      LICENSE_KEY: ${{ secrets.LICENSE_KEY }}
      ONESIGNAL_APP_ID: ${{ vars.ONESIGNAL_APP_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        
      - name: Build website
        run: yarn build

      - name: Upload Build Artyarn buildifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    name: Deploy to GitHub Pages
    needs: build

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    name: Notify subscribers
    needs: deploy
    runs-on: ubuntu-latest
    env:
      ONESIGNAL_APP_ID: ${{ vars.ONESIGNAL_APP_ID }}
      ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Send commit notification
        if: ${{ env.ONESIGNAL_APP_ID != '' && env.ONESIGNAL_REST_API_KEY != '' }}
        run: |
          set -euo pipefail

          commits="$(jq -c '.commits[] | select(.message | startswith("#") | not) |
            (.message | split("\n") | map(select(length > 0))) as $raw_lines |
            ($raw_lines[0] // "") as $first_line |
            (if ($first_line | startswith("!other")) then "other"
             elif ($first_line | startswith("!study")) then "study"
             elif ($first_line | startswith("!deadlines")) then "deadlines"
             else ""
             end) as $channel_override |
            ($raw_lines |
              if length > 0 then .[0] |= sub("^!(study|deadlines|other)[[:space:]]*"; "") else . end |
              map(select(length > 0))) as $lines | {
                title: (if ($lines | length) > 1 then $lines[0] else "" end),
                body: (if ($lines | length) > 1 then $lines[1] else ($lines[0] // "Обновление сайта") end),
                channel_override: $channel_override,
                commit_sha: .id,
                commit_url: .url
              }' "$GITHUB_EVENT_PATH")"

          if [[ -z "$commits" ]]; then
            echo "No commits eligible for push notifications."
            exit 0
          fi

          while IFS= read -r commit; do
            commit_sha="$(jq -r '.commit_sha' <<< "$commit")"
            channel_override="$(jq -r '.channel_override' <<< "$commit")"
            changed_files="$(git diff-tree --root --no-commit-id --name-only -r "$commit_sha")"
            changed_file_count="$(awk 'NF {count++} END {print count + 0}' <<< "$changed_files")"

            if [[ "$channel_override" == "other" ]]; then
              channel_tag="m3300_notify_other"
            elif [[ "$channel_override" == "study" ]]; then
              channel_tag="m3300_notify_study"
            elif [[ "$channel_override" == "deadlines" ]]; then
              channel_tag="m3300_notify_deadlines"
            elif [[ "$changed_file_count" -eq 1 && "$changed_files" == src/pages/* ]]; then
              channel_tag="m3300_notify_study"
            elif [[ "$changed_file_count" -eq 1 && "$changed_files" == "static/DEADLINES.json" ]]; then
              channel_tag="m3300_notify_deadlines"
            else
              channel_tag="m3300_notify_other"
            fi

            notification_title="$(jq -r '.title' <<< "$commit")"
            if [[ -z "$notification_title" ]]; then
              if [[ "$channel_tag" == "m3300_notify_study" ]]; then
                notification_title="Новые материалы"
              elif [[ "$channel_tag" == "m3300_notify_deadlines" ]]; then
                notification_title="Новые дедлайны"
              else
                notification_title="Улучшение сайта"
              fi
            fi

            echo "Commit $commit_sha routed to $channel_tag (changed files: $changed_file_count)"

            payload="$(jq -n \
              --arg app_id "$ONESIGNAL_APP_ID" \
              --arg title "$notification_title" \
              --arg body "$(jq -r '.body' <<< "$commit")" \
              --arg channel_tag "$channel_tag" \
              --arg commit_url "$(jq -r '.commit_url' <<< "$commit")" \
              '{
                app_id: $app_id,
                target_channel: "push",
                filters: [
                  {
                    field: "tag",
                    key: $channel_tag,
                    relation: "=",
                    value: "1"
                  }
                ],
                headings: {en: $title},
                contents: {en: $body},
                url: "https://m3300.nawinds.dev",
                data: {
                  commit_url: $commit_url,
                  notification_channel: $channel_tag
                }
              }')"

            response="$(curl --fail-with-body --silent --show-error \
              --request POST \
              --url https://api.onesignal.com/notifications \
              --header "Authorization: Key $ONESIGNAL_REST_API_KEY" \
              --header 'Content-Type: application/json' \
              --data "$payload")"

            notification_id="$(jq -r '.id // empty' <<< "$response")"
            if [[ -z "$notification_id" ]]; then
              echo "::notice::OneSignal did not create a notification because the selected category has no active subscribers: $response"
              continue
            fi

            echo "OneSignal notification created: $notification_id"
          done <<< "$commits"
