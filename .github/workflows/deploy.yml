name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
    # Review gh actions docs if you want to further define triggers, paths, etc
    # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#on

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    env:
      LICENSE_KEY: ${{ secrets.LICENSE_KEY }}
      ONESIGNAL_APP_ID: ${{ vars.ONESIGNAL_APP_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        
      - name: Build website
        run: yarn build

      - name: Upload Build Artyarn buildifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    name: Deploy to GitHub Pages
    needs: build

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    name: Notify subscribers
    needs: deploy
    runs-on: ubuntu-latest
    env:
      ONESIGNAL_APP_ID: ${{ vars.ONESIGNAL_APP_ID }}
      ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
    steps:
      - name: Send commit notification
        if: ${{ env.ONESIGNAL_APP_ID != '' && env.ONESIGNAL_REST_API_KEY != '' }}
        run: |
          set -euo pipefail

          commits="$(jq -c '.commits[] | select(.message | startswith("#") | not) | {
            title: (.message | split("\n")[0]),
            commit_url: .url
          }' "$GITHUB_EVENT_PATH")"

          if [[ -z "$commits" ]]; then
            echo "No commits eligible for push notifications."
            exit 0
          fi

          segments="$(curl --fail-with-body --silent --show-error \
            --request GET \
            --url "https://api.onesignal.com/apps/$ONESIGNAL_APP_ID/segments" \
            --header "Authorization: Key $ONESIGNAL_REST_API_KEY")"
          segment_id="$(jq -r 'first(.segments[] | select(.name == "Subscribed Users") | .id) // empty' <<< "$segments")"

          if [[ -z "$segment_id" ]]; then
            echo "::error::OneSignal segment 'Subscribed Users' was not found for app $ONESIGNAL_APP_ID. Check that the GitHub variable and API key belong to the same app."
            exit 1
          fi

          segment="$(curl --fail-with-body --silent --show-error \
            --request GET \
            --url "https://api.onesignal.com/apps/$ONESIGNAL_APP_ID/segments/$segment_id" \
            --header "Authorization: Key $ONESIGNAL_REST_API_KEY")"
          subscriber_count="$(jq -r '.subscriber_count // 0' <<< "$segment")"
          echo "Active OneSignal push subscriptions: $subscriber_count"

          if [[ "$subscriber_count" -eq 0 ]]; then
            echo "::error::OneSignal app $ONESIGNAL_APP_ID has subscription records, but no active push subscriptions in 'Subscribed Users'. Check the subscription status/channel in Audience and verify the App ID used by the website."
            exit 1
          fi

          while IFS= read -r commit; do
            payload="$(jq -n \
              --arg app_id "$ONESIGNAL_APP_ID" \
              --arg title "$(jq -r '.title' <<< "$commit")" \
              --arg commit_url "$(jq -r '.commit_url' <<< "$commit")" \
              '{
                app_id: $app_id,
                target_channel: "push",
                included_segments: ["Subscribed Users"],
                headings: {en: $title},
                contents: {en: "На сайте опубликовано обновление"},
                url: "https://m3300.nawinds.dev",
                data: {commit_url: $commit_url}
              }')"

            response="$(curl --fail-with-body --silent --show-error \
              --request POST \
              --url https://api.onesignal.com/notifications \
              --header "Authorization: Key $ONESIGNAL_REST_API_KEY" \
              --header 'Content-Type: application/json' \
              --data "$payload")"

            notification_id="$(jq -r '.id // empty' <<< "$response")"
            if [[ -z "$notification_id" ]]; then
              echo "::error::OneSignal accepted the request but did not create a notification: $response"
              exit 1
            fi

            echo "OneSignal notification created: $notification_id"
          done <<< "$commits"
